<div class="container mt-4">
  <h2 class="text-center mb-3">Our Products</h2>

  <!-- Category Dropdown -->
  <div class="mb-3 text-center">
    <label for="categorySelect" class="form-label me-2">Filter by Category:</label>
    <select
      id="categorySelect"
      class="form-select d-inline-block w-auto"
      [value]="selectedCategory"
      (change)="onCategoryChange($event)"
    >
      <option value="">All</option>
      <option value="Dog">Dog</option>
      <option value="Cat">Cat</option>
      <option value="Fish">Fish</option>
      <option value="Bird">Bird</option>
    </select>
  </div>

  <!-- Loading / Error Messages -->
  <div *ngIf="loading" class="text-center mt-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger text-center">{{ error }}</div>

  <!-- Products Grid -->
  <div class="row mt-3" *ngIf="!loading && !error">
    <div class="col-md-3 mb-4" *ngFor="let p of products">
      <div class="card h-100 shadow-sm">
        <img
          [src]="p.imageUrl || 'assets/no-image.png'"
          class="card-img-top"
          alt="{{ p.name }}"
        />
        <div class="card-body text-center">
          <h5 class="card-title">{{ p.name }}</h5>
          <p class="card-text text-muted">{{ p.category }}</p>
          <p class="fw-bold">₹{{ p.price }}</p>
          <button class="btn btn-primary btn-sm" (click)="openDetail(p)">
            View Details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
